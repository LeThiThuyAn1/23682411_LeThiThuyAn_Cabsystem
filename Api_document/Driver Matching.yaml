openapi: 3.0.0
info:
  title: CAB System API - FR03 Driver Matching
  description: |
    ### FR03 - Find Driver (Tìm tài xế)
    Covers: UC05 - Find and Assign Driver (steps 1-3: determine customer
    location, find available drivers, prioritize by location/status)
    Related Acceptance Criteria: AC01 - Find and Assign Driver

    Scope of FR03:
    - Determine candidate drivers for a booking based on location and
      availability status
    - Rank/prioritize candidates by proximity and operational criteria
    - Does NOT cover sending the request to a driver or handling
      accept/reject/timeout - that is FR04 (Driver Assignment)
  version: 1.0.0

servers:
  - url: http://localhost:8080/api/v1
    description: Local server

tags:
  - name: DriverMatching
    description: Driver search and ranking (UC05)

paths:
  /bookings/{bookingId}/candidate-drivers:
    get:
      summary: Find and rank candidate drivers for a booking
      description: |
        Corresponds to UC05 - Find and Assign Driver, main flow steps 1-3.
        Main flow: system determines the customer's location, finds drivers
        currently in "available" status, then prioritizes candidates that
        are closest to the customer and meet operational criteria.
        Exception flow: if no candidate is found, the response returns an
        empty list, which the assignment process (FR04) uses to trigger the
        "no driver found" notification (see AC01).
      operationId: getCandidateDrivers
      tags:
        - DriverMatching
      security:
        - bearerAuth: []
      parameters:
        - name: bookingId
          in: path
          required: true
          description: ID of the booking request to find drivers for
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Ranked list of candidate drivers (may be empty)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DriverCandidate'
        '404':
          description: Booking not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Booking is not in a state that allows driver search (e.g. already assigned or cancelled)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /drivers/available:
    get:
      summary: List available drivers near a location
      description: |
        Supporting query used by the matching process to check drivers'
        real-time status and location (relies on driver location data
        managed by FR06 - Location Tracking).
        Only returns drivers currently in "available" status.
      operationId: listAvailableDrivers
      tags:
        - DriverMatching
      security:
        - bearerAuth: []
      parameters:
        - name: lat
          in: query
          required: true
          description: Latitude of the reference point (customer pickup location)
          schema:
            type: number
            format: double
        - name: lng
          in: query
          required: true
          description: Longitude of the reference point (customer pickup location)
          schema:
            type: number
            format: double
        - name: vehicleType
          in: query
          required: false
          description: Filter drivers by requested vehicle type
          schema:
            type: string
        - name: radiusKm
          in: query
          required: false
          description: Search radius in kilometers
          schema:
            type: number
            format: double
            default: 5
      responses:
        '200':
          description: List of available drivers within range, sorted by proximity
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DriverCandidate'
        '400':
          description: Invalid or missing location parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    DriverCandidate:
      type: object
      description: A driver ranked as a candidate for a given booking or location.
      properties:
        driverId:
          type: integer
          format: int64
        fullName:
          type: string
        currentLocation:
          $ref: '#/components/schemas/GeoPoint'
        distanceKm:
          type: number
          format: double
          description: Distance from the customer's pickup location
        status:
          type: string
          enum:
            - AVAILABLE
            - BUSY
            - OFFLINE
        priorityScore:
          type: number
          format: double
          description: |
            Computed ranking score based on proximity and other operational
            criteria (e.g. driver rating). Higher score = higher priority.

    GeoPoint:
      type: object
      properties:
        lat:
          type: number
          format: double
        lng:
          type: number
          format: double

    Error:
      type: object
      properties:
        error_code:
          type: string
        message:
          type: string
