openapi: 3.0.0
info:
  title: CAB System API - FR14 Trip and Transaction History
  description: |
    ### FR14 - History Lookup (Quản lý lịch sử)
    Covers: UC13 - View Trip History
    Related Acceptance Criteria: AC03 - Trip Tracking (history is the
    persisted record of a completed/cancelled trip)

    Scope of FR14:
    - Customer views their own trip history and payment/transaction
      history
    - Driver views their own completed trip history
    - This is end-user self-service history lookup. Staff-side,
      cross-user transaction search (UC18) is covered separately in
      FR11 - Operations Management ("/staff/transactions")
    - Read-only; does not modify any business data
  version: 1.0.0

servers:
  - url: http://localhost:8080/api/v1
    description: Local server

tags:
  - name: History
    description: Trip and transaction history lookup (UC13)

paths:
  /customers/{customerId}/trips:
    get:
      summary: List the customer's trip history
      description: |
        Corresponds to UC13 - View Trip History.
        Main flow: customer selects "Trip History"; system returns the
        list of trips the customer has taken (completed or cancelled).
        Exception flow: if there is no history, the response is an empty
        list, and the client should display "no trips yet" (see UC13
        exception: "Không có lịch sử → hiển thị thông báo chưa có chuyến
        đi").
      operationId: listCustomerTripHistory
      tags:
        - History
      security:
        - bearerAuth: []
      parameters:
        - name: customerId
          in: path
          required: true
          description: ID of the customer
          schema:
            type: integer
            format: int64
        - name: status
          in: query
          required: false
          description: Filter by trip status (see TripStatus in FR05); typically COMPLETED or CANCELLED for history
          schema:
            type: string
        - name: fromDate
          in: query
          required: false
          schema:
            type: string
            format: date
        - name: toDate
          in: query
          required: false
          schema:
            type: string
            format: date
        - name: page
          in: query
          required: false
          schema:
            type: integer
            format: int32
            default: 1
        - name: pageSize
          in: query
          required: false
          schema:
            type: integer
            format: int32
            default: 20
      responses:
        '200':
          description: Trip history retrieved successfully (may be an empty list)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TripHistoryPage'
        '401':
          description: Customer is not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Caller does not have permission to view this customer's history
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Customer not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /customers/{customerId}/trips/{tripId}:
    get:
      summary: Get trip detail from history
      description: |
        Corresponds to UC13 - View Trip History, step "Khách hàng chọn
        chuyến để xem chi tiết".
      operationId: getCustomerTripHistoryDetail
      tags:
        - History
      security:
        - bearerAuth: []
      parameters:
        - name: customerId
          in: path
          required: true
          schema:
            type: integer
            format: int64
        - name: tripId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Trip detail found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TripHistoryItem'
        '401':
          description: Customer is not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: This trip does not belong to the authenticated customer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Trip not found in this customer's history
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /customers/{customerId}/payments:
    get:
      summary: List the customer's transaction/payment history
      description: |
        Supports FR14's "tra cứu ... giao dịch" scope by letting the
        customer view their own payment history (linked to FR08 -
        Payment). Distinct from the staff-side, cross-customer search in
        FR11 ("/staff/transactions", UC18).
      operationId: listCustomerPaymentHistory
      tags:
        - History
      security:
        - bearerAuth: []
      parameters:
        - name: customerId
          in: path
          required: true
          schema:
            type: integer
            format: int64
        - name: status
          in: query
          required: false
          description: Payment status filter (see PaymentStatus in FR08)
          schema:
            type: string
        - name: fromDate
          in: query
          required: false
          schema:
            type: string
            format: date
        - name: toDate
          in: query
          required: false
          schema:
            type: string
            format: date
        - name: page
          in: query
          required: false
          schema:
            type: integer
            format: int32
            default: 1
        - name: pageSize
          in: query
          required: false
          schema:
            type: integer
            format: int32
            default: 20
      responses:
        '200':
          description: Payment history retrieved successfully (may be an empty list)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentHistoryPage'
        '401':
          description: Customer is not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Caller does not have permission to view this customer's payments
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Customer not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /drivers/{driverId}/trips:
    get:
      summary: List the driver's completed trip history
      description: |
        Supporting endpoint so a driver can view their own trip history,
        following the same history-lookup pattern as UC13 but for the
        Driver actor. Used together with FR10 ratings to review past
        performance.
      operationId: listDriverTripHistory
      tags:
        - History
      security:
        - bearerAuth: []
      parameters:
        - name: driverId
          in: path
          required: true
          schema:
            type: integer
            format: int64
        - name: status
          in: query
          required: false
          schema:
            type: string
        - name: fromDate
          in: query
          required: false
          schema:
            type: string
            format: date
        - name: toDate
          in: query
          required: false
          schema:
            type: string
            format: date
        - name: page
          in: query
          required: false
          schema:
            type: integer
            format: int32
            default: 1
        - name: pageSize
          in: query
          required: false
          schema:
            type: integer
            format: int32
            default: 20
      responses:
        '200':
          description: Trip history retrieved successfully (may be an empty list)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TripHistoryPage'
        '401':
          description: Driver is not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Caller does not have permission to view this driver's history
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Driver not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    TripHistoryItem:
      type: object
      description: See FR05 - Trip Management for the full Trip schema.
      properties:
        tripId:
          type: integer
          format: int64
        customerId:
          type: integer
          format: int64
        driverId:
          type: integer
          format: int64
        pickupLocation:
          type: string
        destination:
          type: string
        startTime:
          type: string
          format: date-time
        endTime:
          type: string
          format: date-time
        status:
          type: string
          description: Typically COMPLETED or CANCELLED for a history record (see TripStatus in FR05)
        fare:
          type: number
          format: double

    TripHistoryPage:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/TripHistoryItem'
        page:
          type: integer
          format: int32
        pageSize:
          type: integer
          format: int32
        totalItems:
          type: integer
          format: int64

    PaymentHistoryItem:
      type: object
      description: See FR08 - Payment for the full Payment schema.
      properties:
        paymentId:
          type: integer
          format: int64
        tripId:
          type: integer
          format: int64
        paymentMethod:
          type: string
        amount:
          type: number
          format: double
        paymentStatus:
          type: string
        transactionCode:
          type: string
        paymentTime:
          type: string
          format: date-time

    PaymentHistoryPage:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/PaymentHistoryItem'
        page:
          type: integer
          format: int32
        pageSize:
          type: integer
          format: int32
        totalItems:
          type: integer
          format: int64

    Error:
      type: object
      properties:
        error_code:
          type: string
        message:
          type: string
